; ===========================================================================
;  MilRP.ini - runtime configuration for the MilRP game type.
;  Installed to <Postal 2>\System\MilRP.ini by Tools\make.bat (never overwritten
;  once present, so server owners can edit it freely).
;
;  Every key below maps 1:1 to a "var config" in MilRP.MilRPGameInfo.
;  Loadout strings are comma separated Inventory class names.
;  Colours are (R=,G=,B=,A=) 0-255.
; ===========================================================================

[MilRP.MilRPGameInfo]
; --- Ruleset
bEnforceFactions=True
bAllowFactionSwitch=True
FactionSwitchCooldown=300
MaxFactionSize=0
DutyToggleCooldown=15
DutyChangeMode=0
bBlockSameFactionDamage=True
SameFactionDamageScale=0.000000
bOffDutyCannotDamage=False
bUseFactionSpawns=True
bAllowMatchTimers=False
HostTestName=Owner_Marcus
; Protocol version the server advertises to clients and the browser list.
; The 5100 engine still speaks the STP-era "1409X" netcode - leaving these
; at 5100 (the native default) makes every client fail the version check
; with "you need the latest Postal2 update". Match public servers: 1409/1407.
NetEngineVersion=1409
NetMinVersion=1407

; --- Announcements
bAnnounceDutyChanges=True
bAnnouncePromotions=True
bAnnounceFactionJoins=True
bEchoBroadcastsToChat=False

; --- Economy
StartingCurrency=500
StartingBank=0
PaycheckInterval=300
BasePaycheck=100
RankPaycheckMultiplier=0.250000
OnDutyPayMultiplier=1.500000
OffDutyPayScale=0.250000
bAllowNegativeWallet=False
bPaycheckDirectDeposit=True
MaxBankBalance=1000000

; --- Staff registry (0=Player,1=Moderator,2=Admin,3=SuperAdmin,4=Owner)
; UniqueID is the raw IP (port stripped) or other connection signature.
;StaffRegistry=(UniqueID="192.168.1.50",StaffMemo="Marcus",GroupLevel=4)
;StaffRegistry=(UniqueID="192.168.1.51",StaffMemo="SgtMiller",GroupLevel=2)

; --- Banned players (persisted by /ban and the admin menu)
;BanRegistry=(BannedID="192.168.1.200",BannedIP="192.168.1.200",Reason="RDM / FailRP")

; --- Progression
bAutoPromote=True
RPScorePerDutyMinute=1
RPScoreLossPerRDM=10
FinePerRDM=250
bPunishOffDutyKills=True
bPunishSameFactionKills=True
bPunishCivilianKills=True
RankSpeedMultiplier=0.020000

; --- Persistence (records are keyed by upper-cased player name; Postal 2 has
;     no account system, so treat this as convenience persistence, not security)
bPersistPlayerRecords=True
MaxSavedRecords=512

; --- Loadouts
OffDutyLoadout=

; --- Factions (max 8). Index order = faction id.
Factions=(Name="Civilian Population",Tag="CIV",Tint=(R=200,G=200,B=200,A=255),bCombatant=False,DutyLoadout="")
Factions=(Name="United States Army",Tag="USA",Tint=(R=70,G=130,B=60,A=255),bCombatant=True,DutyLoadout="Inventory.PistolWeapon,Inventory.MachinegunWeapon,Inventory.GrenadeWeapon")
Factions=(Name="Russian Ground Forces",Tag="RGF",Tint=(R=180,G=50,B=50,A=255),bCombatant=True,DutyLoadout="Inventory.PistolWeapon,Inventory.RifleWeapon,Inventory.GrenadeWeapon")
Factions=(Name="Military Police",Tag="MP",Tint=(R=60,G=90,B=200,A=255),bCombatant=True,DutyLoadout="Inventory.BatonWeapon,Inventory.PistolWeapon,Inventory.ShotgunWeapon")

; --- Rank ladder (max 16). Index order = rank id, MinScore ascending.
Ranks=(Title="Recruit",MinScore=0)
Ranks=(Title="Private",MinScore=30)
Ranks=(Title="Corporal",MinScore=90)
Ranks=(Title="Sergeant",MinScore=180)
Ranks=(Title="Lieutenant",MinScore=360)
Ranks=(Title="Captain",MinScore=600)
Ranks=(Title="Major",MinScore=900)
Ranks=(Title="Colonel",MinScore=1400)
Ranks=(Title="General",MinScore=2000)
RankHealthBonus(0)=0
RankHealthBonus(1)=0
RankHealthBonus(2)=5
RankHealthBonus(3)=10
RankHealthBonus(4)=15
RankHealthBonus(5)=20
RankHealthBonus(6)=25
RankHealthBonus(7)=30
RankHealthBonus(8)=35

; SavedRecords= lines are appended here automatically by the server.

[MilRP.MilRPPlayer]
; Radius (Unreal units, ~52 per metre) for /me, /do and /l local chat
LocalChatRadius=1280.000000
; HUD toast lifetime and queue depth
NoticeLifetime=6.000000
MaxNotices=4
bPlayNoticeSound=True
; Interaction / menu
MenuTimeout=30.000000
InteractRadius=128.000000
PayRadius=256.000000
; Chat
ChatMaxLength=128
MaxChatLogLines=10
ChatLogLifetime=20.000000
; Voice chat prompt shown to each connecting player (UE2 has no VoIP here)
VoiceChatPrompt="Voice chat is handled externally. Join: discord.gg/YOURINVITE"

[MilRP.MilRPHUD]
; --- Dashboard (top-right). Positions are fractions of the 16:10-normalised screen.
bShowDashboard=True
DashRightPX=0.985000
DashTopPY=0.030000
DashMinWidthPX=0.200000
DashPaddingPX=0.008000
DashFontSize=0
bShowPaycheckTimer=True
bShowWalletDelta=True
WalletFlashDuration=4.000000

; --- Base broadcast feed (top-centre)
bShowBroadcastFeed=True
FeedCenterPX=0.500000
FeedTopPY=0.030000
FeedWidthPX=0.420000
FeedMaxLines=4
FeedFontSize=0
FeedLineLifetime=12.000000
FeedFadeDuration=2.500000
bFeedAlwaysShowHeader=False

; --- Notices (lower-centre toasts)
bShowNotices=True
NoticeCenterPX=0.500000
NoticeBottomPY=0.780000
NoticeFontSize=0
NoticeFadeDuration=1.000000

; --- Alert / interaction / menu
bShowAlertBanner=True
AlertBannerTopPY=0.120000
bShowInteractPrompt=True
InteractPromptPY=0.700000
bShowMenu=True
MenuCenterPX=0.500000
MenuTopPY=0.350000
MenuWidthPX=0.350000
MenuFontSize=0

; --- Chat log + input
bShowChatLog=True
ChatLogLeftPX=0.020000
ChatLogBottomPY=0.300000
ChatLogWidthPX=0.350000
ChatLogMaxVisible=8
ChatLogFontSize=0
ChatLogColor=(R=235,G=235,B=225,A=230)
ChatInputColor=(R=255,G=255,B=255,A=255)

; --- Colours
PanelColor=(R=18,G=24,B=16,A=170)
PanelBorderColor=(R=120,G=140,B=90,A=200)
LabelColor=(R=170,G=180,B=150,A=255)
ValueColor=(R=235,G=235,B=225,A=255)
OnDutyColor=(R=90,G=200,B=90,A=255)
OffDutyColor=(R=150,G=150,B=150,A=255)
MoneyColor=(R=220,G=200,B=90,A=255)
GainColor=(R=120,G=230,B=120,A=255)
LossColor=(R=230,G=110,B=100,A=255)
FeedHeaderColor=(R=200,G=210,B=160,A=255)
FeedTextColor=(R=225,G=230,B=210,A=255)
NoticeColor=(R=255,G=240,B=200,A=255)
AlertColor=(R=220,G=60,B=60,A=255)

[MilRP.MilRPWorld]
; --- Dynamic addon packages (full class path)
AddonPackages=

; --- World interaction points. MapName matches any part of the level URL/title.
;     ClassName must be a MilRPInteractPoint subclass.
;     FactionID 255 = any, else limited to that faction.
;     Extra is class-specific (e.g. shop stock).
;Placeables=(MapName="Asylum",ClassName="MilRP.MilRPATMPaymaster",X=-1000.0,Y=500.0,Z=64.0,Yaw=0,FactionID=255,Extra="")
;Placeables=(MapName="Asylum",ClassName="MilRP.MilRPEnlistTerminal",X=-1200.0,Y=500.0,Z=64.0,Yaw=0,FactionID=255,Extra="")
;Placeables=(MapName="Asylum",ClassName="MilRP.MilRPDutyStation",X=-1100.0,Y=500.0,Z=64.0,Yaw=0,FactionID=255,Extra="")
;Placeables=(MapName="Asylum",ClassName="MilRP.MilRPArmoryLocker",X=-900.0,Y=500.0,Z=64.0,Yaw=0,FactionID=255,Extra="")

; --- Sirens (DEFCON 3+)
SirenInterval=2.000000
SirenSoundClass=
SirenAlertToneClass=
SirenRadius=2000.000000
MaxSirens=0

; --- Stress test (add ?RPTest=1 to URL)
bStressTest=False
StressTestBots=8
StressTestInterval=5.000000

[MilRP.MilRPSiren]
KlaxonSoundClass=jail.fireAlarm
AlertToneClass=AmbientSounds.PoliceSiren2
KlaxonRadius=6000.000000
AlertToneRadius=4000.000000

[MilRP.MilRPCapturePoint]
ZoneName=Outpost Alpha
CurrentOwnerID=255
PassivePaycheck=100
CaptureRadius=250.000000
CaptureRate=5
DecayRate=2
SirenFanfareClass=AmbientSounds.radioPolice
